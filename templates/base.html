<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Product catalog{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('products') }}">Product catalog</a>
    {% if session.get('authenticated') %}
      <nav>
        <a href="{{ url_for('products') }}">Products</a>
        <a href="{{ url_for('create_product') }}">Add product</a>
        <a href="{{ url_for('import_csv') }}">Import CSV</a>
        <form action="{{ url_for('logout') }}" method="post" class="inline">
          <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
          <button class="nav-button" type="submit">Log out</button>
        </form>
      </nav>
    {% endif %}
  </header>
  <main class="container">
    {% for category, message in get_flashed_messages(with_categories=true) %}
      <div class="notice notice-{{ category }}" role="status">{{ message }}</div>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
