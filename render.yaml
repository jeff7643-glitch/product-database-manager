services:
  - type: web
    name: product-database-manager
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: flask --app app init-db && flask --app app seed-sample-products && gunicorn app:app --bind 0.0.0.0:$PORT
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: product-database-manager-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        value: jeff
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: SESSION_COOKIE_SECURE
        value: "1"

databases:
  - name: product-database-manager-db
    databaseName: product_catalog
    user: product_catalog_user
    plan: free
    region: frankfurt
